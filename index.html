<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Scene 360° Photo Gallery</title>
    <!-- Use Proxima Nova Fonts for a clean, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- Include Pannellum library CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <!-- Include Tailwind CSS for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Basic styling */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrollbars */
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }
        #panorama {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        /* Styling for the logo */
        #logo-container {
            position: absolute;
            bottom: 20px; 
            right: 20px;
            z-index: 20; /* Make sure it's above the panorama */
            width: 150px; /* Adjust width as needed */
        }
        #logo-container img {
            width: 100%;
            height: auto;
        }
        /* Styling for the scene navigation */
        #scene-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap; /* Allow buttons to wrap on smaller screens */
            justify-content: center;
            gap: 10px;
        }
        .scene-button {
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background-color: rgba(0, 0, 0, 0.5); /* slightly darker for better contrast */
            color: white;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }
        .scene-button:hover, .scene-button.active {
            background-color: rgba(255, 255, 255, 0.9);
            color: #111;
            border-color: rgba(255, 255, 255, 0.9);
        }
        /* Customizing Pannellum controls */
        .pnlm-load-box {
            border-color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

<!-- The container where the 360 photo viewer will be rendered -->
<div id="panorama"></div>

<!-- Your Logo Here -->
<div id="logo-container">
    <img src="https://i.postimg.cc/vb8PVhCs/dwp-logo-black-01.png" alt="Your Company Logo" 
         onerror="this.onerror=null;this.src='https://i.postimg.cc/vb8PVhCs/dwp-logo-black-01.png';">
</div>

<!-- Navigation for switching between scenes -->
<div id="scene-nav">
    <!-- Buttons are generated by JavaScript -->
</div>

<!-- Include Pannellum library JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<script>
    // FIX: Given unique keys to each scene object (Reception1, Reception2, etc.)
    // FIX: Added "type": "equirectangular" to each scene config
    const scenes = {
        "Reception1": {
            "title": "Reception 1",
            "type": "equirectangular",
            "panorama": "https://i.postimg.cc/CFLXS5rX/1.jpg",
            "autoRotate": -0.5,
            "hfov": 100
        },
        "Reception2": {
            "title": "Reception 2",
            "type": "equirectangular",
            "panorama": "https://i.postimg.cc/YpkYTm91/44.jpg",
            "autoRotate": -1.5,
            "hfov": 110
        },
        "Starbucks": {
            "title": "Starbucks",
            "type": "equirectangular",
            "panorama": "https://i.postimg.cc/vQx8LGfk/starbucks-pano2.jpg",
            "autoRotate": -1.5,
            "hfov": 110
        }
    };

    // FIX: Updated the initial scene to match an exact key from the dictionary above
    let currentScene = "Reception1"; 
    const navContainer = document.getElementById('scene-nav');

    // Initialize the viewer with all scenes at once
    const viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": currentScene,
            "autoLoad": true,
            "showControls": true,
            "sceneFadeDuration": 1000 // Smooth crossfade transition between scenes
        },
        "scenes": scenes
    });

    // Function to switch scenes
    function switchScene(sceneName) {
        if (sceneName === currentScene) return; // Don't reload if it's the same scene

        currentScene = sceneName;
        viewer.loadScene(sceneName);

        // Update active button style
        document.querySelectorAll('.scene-button').forEach(btn => {
            if (btn.dataset.scene === sceneName) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    // Dynamically create navigation buttons from the scenes object
    Object.keys(scenes).forEach(sceneKey => {
        const button = document.createElement('button');
        // Use the title from the scene object for the button text
        button.innerText = scenes[sceneKey].title || sceneKey;
        button.classList.add('scene-button');
        if (sceneKey === currentScene) {
            button.classList.add('active');
        }
        button.dataset.scene = sceneKey; // Store scene key in data attribute
        button.onclick = () => switchScene(sceneKey);
        navContainer.appendChild(button);
    });

</script>

</body>
</html>
